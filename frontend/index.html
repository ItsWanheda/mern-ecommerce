<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="تیک بوتیک؛ فروشگاه آنلاین پوشاک و اکسسوری" />
    <meta name="theme-color" content="#f7f5f0" />
    <script>
      try {
        const savedTheme = localStorage.getItem("tik-boutique-theme");
        if (savedTheme === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#090a0c");
        }
      } catch {
        // The application falls back to the light theme when storage is unavailable.
      }
    </script>
    <title>تیک بوتیک | فروشگاه آنلاین پوشاک و اکسسوری</title>
    <meta property="og:title" content="تیک بوتیک | فروشگاه آنلاین پوشاک و اکسسوری" />
    <meta property="og:description" content="خرید آنلاین پوشاک و اکسسوری با تجربه‌ای ساده، امن و سریع." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
