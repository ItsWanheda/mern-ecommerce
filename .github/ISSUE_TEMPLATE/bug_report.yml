
name: Bug Report
description: Report a reproducible bug or unexpected behavior.
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.
        Please provide enough information for us to reproduce and investigate it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the issue clearly.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the steps required to reproduce the issue.
      placeholder: |
        1. Open...
        2. Navigate to...
        3. Click...
        4. Observe the error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Frontend
        - Backend API
        - Authentication
        - PostgreSQL / Prisma
        - Redis / Cache
        - Products / Categories
        - Orders / Payments
        - Admin Dashboard
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js version, or deployment environment.
      placeholder: Windows 11, Chrome, Node.js 22
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Include sanitized logs. Never include passwords, tokens, or private customer data.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have removed sensitive information from logs and screenshots.
          required: true
