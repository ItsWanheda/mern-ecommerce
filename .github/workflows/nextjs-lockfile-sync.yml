name: Sync independent application lockfiles

on:
  push:
    branches:
      - feat/nextjs-frontend-migration

permissions:
  contents: write

concurrency:
  group: app-lockfile-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-app-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/nextjs-frontend-migration
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate frontend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix frontend

      - name: Regenerate backend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix backend

      - name: Commit synchronized lockfiles when they change
        run: |
          if git diff --quiet -- frontend/package-lock.json backend/package-lock.json; then
            echo "Application lockfiles are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json backend/package-lock.json
          git commit -m "chore(deps): sync frontend and backend lockfiles"
          git push origin HEAD:feat/nextjs-frontend-migration
