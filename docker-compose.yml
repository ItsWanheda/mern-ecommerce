name: hardware-store

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hardware-store-backend
    env_file:
      - ./backend/.env.docker
    environment:
      NODE_ENV: development
      PORT: "5000"
      IMAGE_STORAGE_DIR: /app/uploads
      CLIENT_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      API_URL: http://localhost:5000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - product_images:/app/uploads
    networks:
      - hardware-store-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hardware-store-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: /api
      BACKEND_INTERNAL_URL: http://backend:5000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/dist
    networks:
      - hardware-store-network
    restart: unless-stopped

volumes:
  backend_node_modules:
    name: hardware-store-backend-node-modules
  frontend_node_modules:
    name: hardware-store-frontend-node-modules
  frontend_next_cache:
    name: hardware-store-frontend-next-cache
  product_images:
    name: hardware-store-product-images

networks:
  hardware-store-network:
    name: hardware-store-network
    external: true
